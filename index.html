<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do / Does Master</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Nunito', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; }
        .slide-in { animation: slideIn 0.3s ease-out forwards; }
        .fade-in { animation: fadeIn 0.3s ease-in forwards; }
        .bounce { animation: bounce 0.5s; }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .screen { display: none; }
        .screen.active { display: flex; }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden text-gray-800 flex justify-center items-center bg-gradient-to-br from-indigo-100 via-purple-100 to-pink-100">

    <!-- App Container -->
    <div id="app" class="bg-white w-full h-full max-w-md md:h-[800px] md:max-h-[90vh] md:rounded-3xl md:shadow-2xl relative overflow-hidden flex flex-col">
        
        <!-- ==================== HOME SCREEN ==================== -->
        <div id="home-screen" class="screen active flex-col">
            <div class="flex-1 flex flex-col justify-center items-center p-8 text-center">
                <div class="w-32 h-32 bg-pink-100 rounded-full flex justify-center items-center mb-6 shadow-inner">
                    <i class="fas fa-graduation-cap text-6xl text-pink-500"></i>
                </div>
                <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-purple-600 mb-2">DO / DOES</h1>
                <p class="text-gray-500 text-lg font-medium mb-10">Master the Simple Present Tense!</p>
                
                <div class="w-full space-y-4 mt-8">
                    <button onclick="app.startLearn()" class="w-full group bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 text-white font-bold py-4 px-6 rounded-2xl shadow-lg transform transition active:scale-95 flex items-center justify-between">
                        <span class="flex items-center gap-3 text-xl"><i class="fas fa-book-open"></i> Learn Rules</span>
                        <i class="fas fa-chevron-right group-hover:translate-x-1 transition"></i>
                    </button>
                    
                    <button onclick="app.startQuiz()" class="w-full group bg-gradient-to-r from-pink-500 to-pink-600 hover:from-pink-600 hover:to-pink-700 text-white font-bold py-4 px-6 rounded-2xl shadow-lg transform transition active:scale-95 flex items-center justify-between">
                        <span class="flex items-center gap-3 text-xl"><i class="fas fa-gamepad"></i> Play Quiz</span>
                        <i class="fas fa-chevron-right group-hover:translate-x-1 transition"></i>
                    </button>
                </div>
            </div>
            <div class="p-4 text-center text-gray-400 text-sm">
                Practice a little every day!
            </div>
        </div>


        <!-- ==================== LEARN SCREEN ==================== -->
        <div id="learn-screen" class="screen flex-col bg-slate-50 h-full">
            <!-- Header -->
            <div class="bg-white p-4 shadow-sm flex items-center z-10 shrink-0">
                <button onclick="app.goHome()" class="text-gray-400 hover:text-gray-700 text-xl w-10 h-10 rounded-full hover:bg-gray-100 flex items-center justify-center transition">
                    <i class="fas fa-arrow-left"></i>
                </button>
                <div class="flex-1 text-center font-bold text-lg text-gray-700">Lesson</div>
                <div class="w-10"></div> <!-- Spacer for balance -->
            </div>
            
            <!-- Progress -->
            <div class="w-full bg-gray-200 h-1.5 shrink-0">
                <div id="learn-progress" class="bg-blue-500 h-1.5 transition-all duration-300 w-1/4"></div>
            </div>

            <!-- Slide Container -->
            <div class="flex-1 overflow-y-auto p-6 flex flex-col items-center justify-center" id="slide-container">
                <!-- Content injected by JS -->
            </div>

            <!-- Navigation Controls -->
            <div class="p-6 bg-white border-t flex justify-between items-center gap-4 shrink-0">
                <button id="btn-prev-slide" onclick="app.prevSlide()" class="w-14 h-14 rounded-full bg-gray-100 text-gray-600 hover:bg-gray-200 flex justify-center items-center text-xl transition disabled:opacity-50 disabled:cursor-not-allowed">
                    <i class="fas fa-chevron-left"></i>
                </button>
                <button id="btn-next-slide" onclick="app.nextSlide()" class="flex-1 bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-6 rounded-2xl shadow-md transition transform active:scale-95 text-lg">
                    Next <i class="fas fa-chevron-right ml-2"></i>
                </button>
            </div>
        </div>


        <!-- ==================== QUIZ SCREEN ==================== -->
        <div id="quiz-screen" class="screen flex-col bg-slate-50 h-full relative">
             <!-- Header -->
             <div class="bg-white p-4 shadow-sm flex items-center z-10 shrink-0">
                <button onclick="app.goHome()" class="text-gray-400 hover:text-gray-700 text-xl w-10 h-10 rounded-full hover:bg-gray-100 flex items-center justify-center transition">
                    <i class="fas fa-times"></i>
                </button>
                <div class="flex-1 px-4">
                     <!-- Progress -->
                    <div class="w-full bg-gray-200 rounded-full h-3">
                        <div id="quiz-progress" class="bg-green-500 h-3 rounded-full transition-all duration-500" style="width: 0%"></div>
                    </div>
                </div>
                <div class="w-10 text-right font-bold text-gray-500" id="quiz-counter">1/10</div>
            </div>

            <!-- Question Area -->
            <div class="flex-1 overflow-y-auto p-6 flex flex-col relative" id="quiz-container">
                <!-- Content injected by JS -->
            </div>

            <!-- Quiz Footer / Check Button -->
            <div class="p-6 bg-white border-t border-gray-100 shrink-0" id="quiz-footer">
                <!-- Wrapper for absolute positioning of feedback -->
                <div class="relative w-full">
                    <div id="feedback-message" class="absolute bottom-full mb-4 left-0 w-full rounded-xl p-4 font-bold text-lg hidden flex items-center gap-3 slide-in">
                        <div id="feedback-icon" class="w-8 h-8 rounded-full bg-white flex items-center justify-center shrink-0"></div>
                        <span id="feedback-text"></span>
                    </div>

                    <button id="btn-check" onclick="app.checkAnswer()" class="w-full bg-gray-300 text-gray-500 font-bold py-4 px-6 rounded-2xl text-xl transition pointer-events-none">
                        Check
                    </button>
                    <button id="btn-next-quiz" onclick="app.nextQuestion()" class="hidden w-full text-white font-bold py-4 px-6 rounded-2xl text-xl shadow-lg transition transform active:scale-95">
                        Continue
                    </button>
                </div>
            </div>
            
            <!-- Result Overlay -->
            <div id="quiz-result-overlay" class="absolute inset-0 bg-white flex flex-col justify-center items-center p-8 hidden z-20">
                <div id="result-icon" class="text-8xl mb-6 bounce">🏆</div>
                <h2 class="text-3xl font-extrabold text-gray-800 mb-2">Quiz Complete!</h2>
                <p class="text-gray-500 text-lg mb-8">You scored <span id="final-score" class="font-bold text-green-500 text-2xl">8</span> out of 10.</p>
                
                <div class="w-full space-y-4">
                    <button onclick="app.startQuiz()" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-4 px-6 rounded-2xl shadow-lg transform transition active:scale-95 text-lg">
                        Play Again
                    </button>
                    <button onclick="app.goHome()" class="w-full border-2 border-gray-200 text-gray-700 font-bold py-4 px-6 rounded-2xl transform transition active:scale-95 text-lg">
                        Back to Home
                    </button>
                </div>
            </div>
        </div>

    </div>

    <!-- Audio Effects -->
    <audio id="sfx-correct" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3"></audio>
    <audio id="sfx-wrong" src="https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3"></audio>
    <audio id="sfx-complete" src="https://assets.mixkit.co/active_storage/sfx/2018/2018-preview.mp3"></audio>

    <script src="script.js"></script>
</body>
</html>
