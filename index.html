  <!-- Anti-FOUC Theme Script -->
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('dd-theme');
        var prefersDark = typeof window.matchMedia === 'function' && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = saved === 'dark' || saved === 'light' ? saved : (prefersDark ? 'dark' : 'light');
        document.documentElement.classList.toggle('dark', theme === 'dark');
      } catch (e) {
        document.documentElement.classList.toggle('dark', typeof window.matchMedia === 'function' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      }
    })();
  </script>
